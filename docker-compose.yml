services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_infra
    ports:
      - "5432:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_infra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  atlas_pgdata:
